name: chess
# Community chess board: a visitor clicks a move link in README.md, which opens a pre-filled issue.
# This workflow validates the title, plays the move with python-chess, redraws the board and closes the issue.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: chess
  cancel-in-progress: false
jobs:
  move:
    if: startsWith(github.event.issue.title, 'Chess:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only well-formed move titles
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if ! printf '%s' "$ISSUE_TITLE" | grep -Eq '^Chess: (Move [A-Ha-h][1-8] to [A-Ha-h][1-8]|Start new game)$'; then
            echo "Ignoring issue with unexpected title"; exit 0
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Play the move and redraw the board
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          pip install -q -r requirements.txt
          python main.py
      - name: Commit and push
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chess: ${ISSUE_TITLE#Chess: } by @${ISSUE_AUTHOR}" || echo "nothing to commit"
          git push
